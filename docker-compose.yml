services:
  portal-sso:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal_sso_app
    restart: unless-stopped
    ports:
      - "5170:5170"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
